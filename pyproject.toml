# Tooling configuration. This project is run as an application (uvicorn/Docker),
# not installed as a package, so there is deliberately no [build-system] here.

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["venv", "logs"]

[tool.ruff.lint]
# Lint only -- `ruff format` is deliberately not enabled. It reprints from the AST
# rather than diffing against the existing style, so it would rewrite 231 sites for
# +1170 net lines, mostly exploding hand-grouped call arguments to one per line.
#
# E501 (line too long) is absent for the same reason: with no formatter to wrap code
# automatically, enforcing it would mean 215 manual rewraps, and it cannot split the
# long prompt strings in ai_interpreter.py at all. `line-length` below documents the
# intended width and feeds the rules that reference it.
select = [
    "E4", "E7", "E9",  # pycodestyle — the subset that survives a formatter
    "F",               # pyflakes: undefined names, unused imports/variables
    "I",               # import ordering
    "B",               # bugbear: mutable defaults, shadowed loop vars, ...
    "UP",              # pyupgrade: modern syntax for the target version
    "C4",              # flake8-comprehensions
]

[tool.ruff.lint.per-file-ignores]
# Test files legitimately import fixtures for side effects and shadow names.
"backend/tests/*" = ["F811"]
