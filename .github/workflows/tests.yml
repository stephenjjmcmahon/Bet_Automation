name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    env:
      # The suite mocks every Betfair and OpenAI call, but the OpenAI client is
      # constructed at import time and refuses a missing key — so a dummy value is
      # needed for collection to succeed. No real credentials are used, and no test
      # reaches the network.
      OPENAI_API_KEY: test-key-not-used
      BETFAIR_APP_KEY: test-key-not-used
      SESSION_SECRET_KEY: test-secret-not-used
      APP_ENV: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
